services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: chat
      MYSQL_USER: chat
      MYSQL_PASSWORD: chat
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uchat", "-pchat"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysqldata:
